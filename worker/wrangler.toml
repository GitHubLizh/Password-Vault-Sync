name = "password-vault-sync-probe"
main = "index.mjs"
compatibility_date = "2026-10-01"
# 部署后即可得到 https://password-vault-sync-probe.<你的子域>.workers.dev
# 阶段 0 只要它响 /ping，用来把 workers.dev 域名类的可达性测出来（第 2 轮探针的自填地址）。
workers_dev = true

# 阶段 2 的只读代理才需要桶绑定。先注释掉：桶名不存在会让部署直接失败。
# [[r2_buckets]]
# binding = "VAULT_SYNC"
# bucket_name = "<换成你的 R2 桶名>"
